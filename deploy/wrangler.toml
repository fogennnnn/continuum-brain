# Overwrite-deploy of the ContinuumBrain-v1 demo onto the "test-omni" slot.
# Deploy: npx wrangler deploy --config deploy/wrangler.toml
# No Durable Objects, no KV: static assets + two read-only JSON endpoints.
name = "test-omni"
main = "worker.js"
compatibility_date = "2026-10-02"

[assets]
directory = "./public"
binding = "ASSETS"
